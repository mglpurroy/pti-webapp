# PTI Builder dataset — Demoland (synthetic)
#
# Build:   python prep/build_dataset.py prep/examples/demoland/pti.yaml
# Every option is documented in docs/CONFIGURATION.md.
#
# Method: devPTIpack. Each indicator is z-scored among the units of every
# level it is prepared for; the PTI is the weighted sum of z-scores, with the
# sign of each weight giving its direction. The app never aggregates upward,
# so coarser-level values are prepared here (aggregate_to / sources).

id: demoland
output: ../../../app/data/demoland      # relative to this file

# ── What the app shows ────────────────────────────────────────
app:
  title: Project Targeting Index
  country: Demoland
  subtitle: Synthetic demo data · 5 km grid
  default_level: district
  bins: 5                     # priority groups (quantiles); Priority 1 = highest PTI
  missing: no_priority        # no_priority | ignore  (devPTIpack's na_rm_pti)
  cross_level: project        # project | devptipack_code
  pillars:
    - {name: Poverty & Welfare, color: "#e67e22"}
    - {name: Services & Access, color: "#2980b9"}
    - {name: Human Development, color: "#8e44ad"}
    - {name: Climate & Environment, color: "#16a085"}
    - {name: Fragility & Operations, color: "#c0392b"}
  # Weighting schemes. Positive weight: higher value → higher priority;
  # negative: higher value → lower priority. |w| sets relative importance.
  scenarios:
    - id: core
      label: Core PTI
      description: Multi-sector need — poverty weighted double
      weights: {poverty_headcount: 2, travel_time_health: 1, electricity_access: -1,
                net_enrolment: -1, stunting_rate: 1, food_insecurity_phase: 1}
    - id: social
      label: Social Development PTI
      description: Poverty, education and nutrition
      weights: {poverty_headcount: 2, net_enrolment: -1, stunting_rate: 1}
    - id: energy
      label: Energy PTI
      description: Unserved, populous and poor areas
      weights: {electricity_access: -2, population_count: 1, poverty_headcount: 1}
    - id: nutrition
      label: Nutrition PTI
      description: Food insecurity, stunting and health access
      weights: {food_insecurity_phase: 2, stunting_rate: 2, travel_time_health: 1}
    - id: operable
      label: Core PTI + operational access
      description: Core need, lowered where field access is restricted
      weights: {poverty_headcount: 2, travel_time_health: 1, electricity_access: -1,
                net_enrolment: -1, stunting_rate: 1, food_insecurity_phase: 1, restricted_access: -2}
  about:
    disclaimer: >-
      All data in this demo are synthetic. Demoland does not exist.
  # Optional: let users publish results to ArcGIS Online / Enterprise
  arcgis_publish:
    portal: https://www.arcgis.com

# ── Spatial units, coarse → fine ──────────────────────────────
levels:
  - key: region
    label: Region
    code: region_code
    name: region_name
    boundaries: {file: inputs/regions.gpkg}
  - key: district
    label: District
    code: district_code
    name: district_name
    boundaries: {file: inputs/districts.gpkg}
  - key: cell
    label: Grid cell
    code: cell_id
    name: cell_name
    boundaries: {file: inputs/cells.gpkg}
    # no `parents:` → each unit is assigned to the polygons containing it

simplify: {region: 0.002, district: 0.001}

population:
  level: cell
  source: {type: table, file: inputs/cell_indicators.csv, key: cell_id, column: population}

# ── Indicators ────────────────────────────────────────────────
# level         where `source` is measured
# aggregate_to  coarser levels computed directly from `level`
# aggregate     {fn: mean|sum|min|max|median, weight: population|area|none}
# sources       values supplied directly at other levels
# higher_is_worse  hint only: default sign when the indicator is ticked, and map colours
indicators:
  - id: poverty_headcount
    label: Poverty headcount
    pillar: Poverty & Welfare
    higher_is_worse: true
    unit: "%"
    year: 2024
    source_note: Small-area estimate, household survey 2024 (synthetic)
    level: cell
    fill: median              # 3% of cells have no estimate
    source: {type: table, file: inputs/cell_indicators.csv, key: cell_id, column: poverty_headcount}
    aggregate_to: [district, region]
    aggregate: {fn: mean, weight: population}

  - id: food_insecurity_phase
    label: Food insecurity phase (IPC)
    pillar: Poverty & Welfare
    higher_is_worse: true
    unit: phase 1–5
    year: 2025
    source_note: Regional food security analysis (synthetic), joined on region name
    level: region
    source: {type: table, file: inputs/region_food_security.csv, name_key: Region, column: food_insecurity_phase}

  - id: travel_time_health
    label: Travel time to health facility
    pillar: Services & Access
    higher_is_worse: true
    unit: minutes
    year: 2025
    source_note: Cost-distance surface (synthetic raster), mean per unit
    level: cell
    source: {type: raster, file: inputs/travel_time_health.tif, stat: mean}
    sources:                  # zonal statistics straight from the raster at district level
      district: {type: raster, file: inputs/travel_time_health.tif, stat: mean}
    aggregate_to: [region]
    aggregate: {fn: mean, weight: population}

  - id: facilities_per_1000
    label: Health facilities per 1,000 people
    pillar: Services & Access
    higher_is_worse: false
    unit: per 1,000
    source_note: Facility registry points counted per unit (synthetic)
    level: district
    source: {type: points, file: inputs/health_facilities.gpkg, stat: per_1000_pop}
    sources:
      region: {type: points, file: inputs/health_facilities.gpkg, stat: per_1000_pop}

  - id: electricity_access
    label: Electricity access
    pillar: Services & Access
    higher_is_worse: false
    unit: "% households"
    year: 2024
    source_note: Household survey 2024 (synthetic) — 5% of cells missing, not filled
    level: cell
    source: {type: table, file: inputs/cell_indicators.csv, key: cell_id, column: electricity_access}
    aggregate_to: [district, region]
    aggregate: {fn: mean, weight: population}

  - id: population_count
    label: Population
    pillar: Services & Access
    higher_is_worse: true
    unit: people
    source_note: Gridded population (synthetic)
    level: cell
    source: {type: table, file: inputs/cell_indicators.csv, key: cell_id, column: population}
    aggregate_to: [district, region]
    aggregate: {fn: sum}

  - id: net_enrolment
    label: Net primary enrolment
    pillar: Human Development
    higher_is_worse: false
    unit: "%"
    year: 2023
    source_note: Education census 2023 (synthetic)
    level: cell
    source: {type: table, file: inputs/cell_indicators.csv, key: cell_id, column: net_enrolment}
    aggregate_to: [district, region]
    aggregate: {fn: mean, weight: population}

  - id: stunting_rate
    label: Child stunting
    pillar: Human Development
    higher_is_worse: true
    unit: "% under-5"
    year: 2023
    source_note: Nutrition survey, representative at district level (synthetic)
    level: district
    source: {type: table, file: inputs/district_stats.csv, key: district_code, column: stunting_rate}
    aggregate_to: [region]
    aggregate: {fn: mean, weight: population}

  - id: flood_exposure
    label: Flood exposure
    pillar: Climate & Environment
    higher_is_worse: true
    unit: index 0–100
    source_note: Hazard model (synthetic)
    level: cell
    source: {type: table, file: inputs/cell_indicators.csv, key: cell_id, column: flood_exposure}
    aggregate_to: [district, region]
    aggregate: {fn: mean, weight: area}

  - id: ndvi_change
    label: Vegetation change (NDVI)
    pillar: Climate & Environment
    higher_is_worse: false
    unit: Δ NDVI 2015–2025
    source_note: Satellite-derived (synthetic) — negative values are valid
    level: cell
    source: {type: table, file: inputs/cell_indicators.csv, key: cell_id, column: ndvi_change}
    aggregate_to: [district, region]
    aggregate: {fn: mean, weight: area}

  - id: conflict_events
    label: Conflict events (3 years)
    pillar: Fragility & Operations
    higher_is_worse: true
    unit: events
    source_note: Event data, 2023–2025 (synthetic)
    level: cell
    fill: zero
    source: {type: table, file: inputs/cell_indicators.csv, key: cell_id, column: conflict_events_3y}
    aggregate_to: [district, region]
    aggregate: {fn: sum}

  - id: restricted_access
    label: Restricted field access
    pillar: Fragility & Operations
    higher_is_worse: false
    unit: share of area
    source_note: >-
      Security access map (synthetic): 1 = restricted. A spatial operational
      constraint — give it a negative weight to lower priority where access is restricted.
    level: cell
    source: {type: table, file: inputs/cell_indicators.csv, key: cell_id, column: restricted_access}
    aggregate_to: [district, region]
    aggregate: {fn: mean, weight: area}

# ── Map overlays ──────────────────────────────────────────────
overlays:
  - id: projects
    label: Project portfolio
    file: inputs/projects.gpkg
    role: portfolio
    label_field: name
    fields: [project_id, sector, status]
    color: "#1e3a8a"
  - id: facilities
    label: Health facilities
    file: inputs/health_facilities.gpkg
    label_field: type
    color: "#be185d"
  - id: roads
    label: Main roads
    file: inputs/roads.gpkg
    fields: [class]
    color: "#57534e"
  - id: towns
    label: Towns
    file: inputs/towns.gpkg
    label_field: name
    fields: [population_k]
    color: "#0f172a"
